        }
        let M = 0;
        for (const p of placed) M += p.m;
        const vs = Math.sqrt(M / 700) * 0.45;
        for (const p of placed) {
          bodies.push(makeBody(p.x, p.y, gauss() * vs, gauss() * vs, p.m, 'star'));
        }
        for (let i = 0; i < 30; i++) {
          const r = 850 * Math.sqrt(rand()), a = rand() * Math.PI * 2;
          bodies.push(makeBody(Math.cos(a) * r, Math.sin(a) * r, gauss() * vs, gauss() * vs, 4 + rand() * 30, 'planet'));
        }
        zeroMomentum();
        for (let i = 0; i < 900; i++) {
          const r = 900 * Math.sqrt(rand()), a = rand() * Math.PI * 2;
          addTracer(Math.cos(a) * r, Math.sin(a) * r, gauss() * vs * 0.8, gauss() * vs * 0.8, pick(NONPROBE));
        }
      }
    },
    empty: {
      fit: 700,
      blurb: coarse ? 'Nothing here yet. Touch and hold anywhere to start a universe.' : `Nothing here yet. Hold ${MOD} and drag anywhere to start a universe.`,
      build() {}
    }
  };

  function loadScene(key, isRestart = false) {
    sceneKey = key;
    bodies = [];
    effects = [];
    T.n = 0;
    simTime = 0;
    frameN = 0;   // life and cull run on frame multiples; reset so seeded runs repeat exactly
    lifeClock = 0;
    trailClock = 0;
    shedClock = 0;
    flash = 0;
    shake = 0;
    aim = null;
    spawned = false;
    deselect();
    SCENES[key].build();
    accel();
    pairs.length = 0;
    lights = bodies.filter(b => b.kind === 'star');
    cam.x = 0; cam.y = 0; cam.target = null;
    // a hidden or collapsed page has no size yet; fall back to a sane zoom
    cam.z = VW && VH ? clampZoom(Math.min(VW, VH) * 0.46 / SCENES[key].fit) : 0.5;
    if (SCENES[key].zones && !showZones) toggleZones();
    if (!isRestart) setRate(SCENES[key].rate || RATE_DEFAULT);
    feed.textContent = '';
    for (const k in lastEv) delete lastEv[k];
    pushEvent(SCENES[key].blurb, 'info', 'blurb', 1500);
    updateHud();
  }

  // ---------------------------------------------------------------------------
  // Viewport, camera, backdrop
  // ---------------------------------------------------------------------------
  let VW = 0, VH = 0, dpr = 1, backdrop = null, hudBottom = 0;
  const starTile = document.createElement('canvas');
  (function buildStarTile() {
    const S = 512;
    starTile.width = starTile.height = S;
    const g = starTile.getContext('2d');
    const tints = ['255,214,170', '180,205,255', '235,232,225', '235,232,225', '255,170,150', '200,180,255', '170,235,255', '255,236,180'];
    for (let i = 0; i < 260; i++) {
      const x = Math.random() * S, y = Math.random() * S, b = Math.random();
      const r = b > 0.97 ? 1.25 : b > 0.85 ? 0.85 : 0.55;
      const a = (0.2 + Math.random() * 0.5).toFixed(2);
      g.fillStyle = `rgba(${pick(tints)},${a})`;
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
  })();

  function resize() {
    VW = stage.clientWidth; VH = stage.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    // Cache how far down the readout HUD reaches, so drawZones() can keep its
    // labels from landing underneath it (recomputed here, not per frame).
    const readout = document.querySelector('.readout');
    hudBottom = readout.getBoundingClientRect().bottom - stage.getBoundingClientRect().top;
    canvas.width = Math.round(VW * dpr);
    canvas.height = Math.round(VH * dpr);
    backdrop = document.createElement('canvas');
    backdrop.width = canvas.width; backdrop.height = canvas.height;
    const g = backdrop.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = '#04050a';
    g.fillRect(0, 0, VW, VH);
    const neb = [
      [0.16, 0.28, 0.6, '64,90,190', 0.12], [0.84, 0.74, 0.55, '190,70,110', 0.08],
      [0.62, 0.12, 0.35, '40,160,170', 0.07], [0.36, 0.86, 0.42, '120,70,200', 0.08],
      [0.95, 0.18, 0.3, '220,120,60', 0.05]
    ];
    for (const [fx, fy, fr, c, a] of neb) {
      const R = Math.max(VW, VH) * fr;
      const gr = g.createRadialGradient(fx * VW, fy * VH, 0, fx * VW, fy * VH, R);
      gr.addColorStop(0, `rgba(${c},${a})`);
      gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr;
      g.fillRect(0, 0, VW, VH);
    }
  }

  const sx = x => (x - cam.x) * cam.z + VW / 2;
  const sy = y => (y - cam.y) * cam.z + VH / 2;
  const wx = X => (X - VW / 2) / cam.z + cam.x;
  const wy = Y => (Y - VH / 2) / cam.z + cam.y;
  // minimum on-screen radius, so small things stay visible when zoomed out
  function visR(b) { return Math.max(b.kind === 'bh' ? 4 : b.kind === 'star' ? 1.8 : 2, b.r * cam.z); }

  function zoomAt(px, py, z) {
    const X = wx(px), Y = wy(py);
    cam.z = clampZoom(z);
    cam.x = X - (px - VW / 2) / cam.z;
    cam.y = Y - (py - VH / 2) / cam.z;
    cam.target = null;
  }
  function centerView() {
    if (selected) { setFollow(true); return; }
    const c = mainGroup();
    cam.target = { x: c.x, y: c.y };
  }

  // ---------------------------------------------------------------------------
  // Aiming: press to place, hold still to add mass, drag to set velocity.
  // Mass grows exponentially from the tool's base toward its maximum, so a long
  // hold makes something far heavier than a tap. Dragging locks the mass in;
  // the scroll wheel, or pinching with a second finger, fine-tunes it.
  // ---------------------------------------------------------------------------
  const TOOLS = {
    planet: { base: 12, min: 0.1, max: 940, name: 'planet' },
    comet: { base: 0.5, min: 0.05, max: 8, name: 'comet' },
    star: { base: MSUN, min: IGNITE, max: 100 * MSUN, name: 'star' },
    bh: { base: 5 * MSUN, min: 3 * MSUN, max: 1000 * MSUN, name: 'black hole' },
    dust: { base: 150, min: 20, max: 3000, name: 'dust cloud' }
  };
  const GROW_DELAY = 0.15;      // s a press lasts before it starts to grow
  const GROW_TIME = 4;          // s of holding to go from base mass to maximum
  let aim = null;
  let aimHeavy = [];

  // Aim mass is tracked as a log offset from the tool's base mass.
  function lmRange() {
    const d = TOOLS[tool];
    return [Math.log(d.min / d.base), Math.log(d.max / d.base)];
  }
  function aimLm() {
    const [lo, hi] = lmRange();
    if (!aim.grow) return clamp(aim.lm, lo, hi);
    const t = Math.max(0, (performance.now() - aim.t0) / 1000 - GROW_DELAY);
    return clamp(aim.lm + t * hi / GROW_TIME, lo, hi);
  }
  function freezeGrowth() {
    if (!aim.grow) return;
    aim.lm = aimLm();
    aim.grow = false;
  }
  function aimMass() {
    const m = TOOLS[tool].base * Math.exp(aimLm());
    return tool === 'dust' ? Math.round(m) : m;
  }
  const assistOn = () => orbitAssist || (aim && aim.shift);
  function assistSign(dx, dy) {
    const ddx = aim.cx - aim.sx, ddy = aim.cy - aim.sy;
    if (Math.hypot(ddx, ddy) <= 6) return 1;
    return ddx * -dy + ddy * dx >= 0 ? 1 : -1;
  }
  function aimVel() {
    const p = aim.primary;
    if (assistOn() && p && !p.dead) {
      const dx = aim.wx - p.x, dy = aim.wy - p.y, r = Math.hypot(dx, dy) || 1;
      const extra = tool === 'dust' ? 0 : aimMass();
      const v = circV(p.m + extra, r), s = assistSign(dx, dy);
      return { x: p.vx - s * v * dy / r, y: p.vy + s * v * dx / r };
    }
    const k = 0.06 / Math.sqrt(cam.z);
    return { x: (aim.cx - aim.sx) * k, y: (aim.cy - aim.sy) * k };
  }
  const cloudR = count => (20 + Math.sqrt(count) * 3) / cam.z;

  function startAim(id, X, Y, shift) {
    const Wx = wx(X), Wy = wy(Y);
    let primary = null, bw = 0;
    for (const b of bodies) {
      const dx = b.x - Wx, dy = b.y - Wy, w = b.m / (dx * dx + dy * dy + 1);
      if (w > bw) { bw = w; primary = b; }
    }
    aim = {
      id, sx: X, sy: Y, cx: X, cy: Y, wx: Wx, wy: Wy, t0: performance.now(), shift, primary,
      grow: true, lm: 0, resize: null, style: pick(PLANET_KEYS), rocky: pick(ROCKY), fam: pick(DUST_FAMILIES)
    };
    aimHeavy = bodies.slice().sort((a, b) => b.m - a.m).slice(0, 40);
    updateCursor();
  }

  // The planet style is settled when aiming starts (one choice for normal
  // masses, one for small rocky ones), so the preview doesn't flicker and the
  // planet you throw looks like the preview.
  function aimStyle(m) {
    if (m > DWARF) return 'dwarf';
    if (m < 2 && !ROCKY.includes(aim.style)) return aim.rocky;
    return aim.style;
  }

  function spawn() {
    const a = aim;
    const m = aimMass();
    const v = aimVel();
    const assist = assistOn() && a.primary && !a.primary.dead;
    if (tool === 'dust') {
      const R = cloudR(m);
      const p = a.primary;
      const s = assist ? assistSign(a.wx - p.x, a.wy - p.y) : 1;
      if (T.n + m > MAX_T) pushEvent(`Dust limit reached: only ${Math.max(0, MAX_T - T.n).toLocaleString()} of ${m.toLocaleString()} particles fit`, 'info', 'dustcap', 5000);
      for (let i = 0; i < m; i++) {
        const rr = Math.abs(gauss()) * R * 0.5, ang = rand() * Math.PI * 2;
        const x = a.wx + Math.cos(ang) * rr, y = a.wy + Math.sin(ang) * rr;
        if (assist) {
          const dx = x - p.x, dy = y - p.y, r = Math.hypot(dx, dy) || 1, vc = circV(p.m, r);
          addTracer(x, y, p.vx - s * vc * dy / r, p.vy + s * vc * dx / r, pick(a.fam));
        } else {
          addTracer(x, y, v.x + gauss() * 0.3, v.y + gauss() * 0.3, pick(a.fam));
        }
      }
    } else {
      const b = tool === 'comet' ? makeComet(a.wx, a.wy, v.x, v.y, m)
        : makeBody(a.wx, a.wy, v.x, v.y, m, tool, tool === 'planet' ? aimStyle(m) : undefined);
      let M0 = 0, px = 0, py = 0;
      if (assist) for (const o of bodies) { M0 += o.m; px += o.m * o.vx; py += o.m * o.vy; }
      bodies.push(b);
      if (assist && M0) {
        // A heavy body thrown into orbit would otherwise send the whole system
        // lurching. Boosting everything by the same amount keeps the system's
        // centre of mass where it was and leaves every orbit, including the
        // new one, intact.
        const M1 = M0 + m;
        boostAll(px / M0 - (px + m * b.vx) / M1, py / M0 - (py + m * b.vy) / M1);
      }
      if (b.kind === 'star') lights = bodies.filter(o => o.kind === 'star');
      accel();
      pairs.length = 0;
    }
    aim = null;
    if (!spawned) { spawned = true; hint.classList.add('gone'); }
  }

  function predict(x, y, vx, vy) {
    const pts = [x, y];
    const dt = DT * 2;
    const hs = aimHeavy.filter(b => !b.dead);   // skip bodies that merged while aiming
    for (let s = 0; s < 480; s++) {
      let ax = 0, ay = 0, hit = false;
      for (let k = 0; k < hs.length; k++) {
        const b = hs[k];
        const dx = b.x - x, dy = b.y - y, r2 = dx * dx + dy * dy;
        if (r2 < b.cr * b.cr) { hit = true; break; }
        const d2 = r2 + EPS2, f = b.m / (d2 * Math.sqrt(d2));
        ax += f * dx; ay += f * dy;
      }
      if (hit) break;
      vx += ax * dt; vy += ay * dt;
      x += vx * dt; y += vy * dt;
      if (s % 3 === 2) pts.push(x, y);
    }
    return pts;
  }

  function bodyAt(X, Y) {
    let best = null, bd = Infinity;
    for (const b of bodies) {
      const d = Math.hypot(sx(b.x) - X, sy(b.y) - Y);
      const lim = Math.max(visR(b) + 6, 14);
      if (d < lim && d < bd) { bd = d; best = b; }
    }
    return best;
  }

  // ---------------------------------------------------------------------------
  // Input
  //   Mouse: drag to move the view, click to inspect, scroll to zoom, and hold
  //          Ctrl (⌘ on a Mac) and drag to throw.
  //   Touch: drag to move, tap to inspect, pinch to zoom, and touch and hold to
  //          place, then drag to throw. While placing, a second finger pinches
  //          the new object bigger or smaller.
  // ---------------------------------------------------------------------------
  const LONG_PRESS = 380;       // ms a finger rests before it starts placing
  const SLOP = 8;               // px a touch can wander and still count as a tap or hold
  const pointers = new Map();
  let gesture = null, pan = null, hover = null, modDown = false;

  function startGesture() {
    const p = [...pointers.values()];
    const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
    gesture = { d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, z0: cam.z, wx: wx(mx), wy: wy(my) };
    cam.target = null;
  }
  function startResize(id) {
    const a = pointers.get(aim.id), b = pointers.get(id);
    if (!a || !b) return;
    freezeGrowth();
    // cube for bodies whose radius goes with ∛m, square for the rest, so the
    // ghost grows roughly in step with the fingers
    const k = tool === 'planet' || tool === 'comet' ? 3 : 2;
    aim.resize = { id, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, lm0: aim.lm, k };
  }
  function checkLongPress() {
    if (!pan || !pan.touch || pan.moved || gesture || pointers.size !== 1) return;
    if (performance.now() - pan.t0 < LONG_PRESS) return;
    const id = pan.id, p = pointers.get(id);
    pan = null;
    if (!p) return;
    startAim(id, p.x, p.y, false);
    try { navigator.vibrate && navigator.vibrate(12); } catch (err) { /* no haptics */ }
  }

  function updateCursor() {
    let c = 'grab';
    if (gesture || (pan && pan.moved)) c = 'grabbing';
    else if (aim || modDown) c = 'crosshair';
    else if (hover && bodyAt(hover.x, hover.y)) c = 'pointer';
    if (canvas.style.cursor !== c) canvas.style.cursor = c;
  }
  function setMod(v) {
    if (v === modDown) return;
    modDown = v;
    updateCursor();
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    const X = e.offsetX, Y = e.offsetY;
    const mouse = e.pointerType === 'mouse';
    pointers.set(e.pointerId, { x: X, y: Y });
    if (!mouse && pointers.size === 2) {
      if (aim) startResize(e.pointerId);
      else { pan = null; startGesture(); }
      return;
    }
    if (pointers.size > 1 || gesture) return;
    if (mouse && e.button === 0 && (e.ctrlKey || e.metaKey)) {
      startAim(e.pointerId, X, Y, e.shiftKey);
      return;
    }
    pan = { id: e.pointerId, x: X, y: Y, sx: X, sy: Y, t0: performance.now(), moved: false, tap: !mouse || e.button === 0, touch: !mouse };
  });

  canvas.addEventListener('pointermove', e => {
    const X = e.offsetX, Y = e.offsetY;
    if (e.pointerType === 'mouse') { hover = { x: X, y: Y }; modDown = e.ctrlKey || e.metaKey; }
    if (!pointers.has(e.pointerId)) { updateCursor(); return; }
    // a mouse moving with no button down missed its pointerup: drop the drag
    if (e.pointerType === 'mouse' && e.buttons === 0) {
      endPointer(new PointerEvent('pointercancel', { pointerId: e.pointerId }));
      return;
    }
    pointers.set(e.pointerId, { x: X, y: Y });
    if (gesture) {
      if (pointers.size < 2) return;
      const p = [...pointers.values()];
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
      cam.z = clampZoom(gesture.z0 * d / gesture.d0);
      cam.x = gesture.wx - (mx - VW / 2) / cam.z;
      cam.y = gesture.wy - (my - VH / 2) / cam.z;
      return;
    }
    if (aim) {
      if (e.pointerId === aim.id) {
        aim.cx = X; aim.cy = Y; aim.shift = e.shiftKey;
        if (aim.grow && Math.hypot(X - aim.sx, Y - aim.sy) > SLOP) freezeGrowth();
      }
      if (aim.resize) {
        const a = pointers.get(aim.id), b = pointers.get(aim.resize.id);
        if (a && b) aim.lm = aim.resize.lm0 + aim.resize.k * Math.log((Math.hypot(a.x - b.x, a.y - b.y) || 1) / aim.resize.d0);
      }
      return;
    }
    if (pan && pan.id === e.pointerId) {
      if (!pan.moved) {
        if (Math.hypot(X - pan.sx, Y - pan.sy) < (pan.touch ? SLOP : 4)) return;
        pan.moved = true;
        cam.target = null;
        setFollow(false);
        dragTip();
        updateCursor();
      }
      cam.x -= (X - pan.x) / cam.z;
      cam.y -= (Y - pan.y) / cam.z;
      pan.x = X; pan.y = Y;
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    const up = e.type === 'pointerup';
    if (gesture) {
      if (pointers.size >= 2) startGesture();
      else {
        gesture = null;
        // the finger still down carries on moving the view once it moves
        const [id, p] = [...pointers.entries()][0] || [];
        if (p) pan = { id, x: p.x, y: p.y, sx: p.x, sy: p.y, t0: 0, moved: false, tap: false, touch: false };
      }
    } else if (aim) {
      if (aim.resize && e.pointerId === aim.resize.id) aim.resize = null;
      else if (e.pointerId === aim.id) { if (up) spawn(); else aim = null; }
    } else if (pan && pan.id === e.pointerId) {
      const p = pan;
      pan = null;
      if (up && p.tap && !p.moved) {
        const b = bodyAt(e.offsetX, e.offsetY);
        if (b) select(b);
        else if (selected) deselect();
      }
    }
    updateCursor();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  // if the browser drops a pointerup (say the button was released in another
  // window), end the drag instead of leaving it stuck
  canvas.addEventListener('lostpointercapture', e => {
    if (pointers.has(e.pointerId)) endPointer(new PointerEvent('pointercancel', { pointerId: e.pointerId }));
  });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const dy = e.deltaY * (e.deltaMode === 1 ? 33 : 1);
    if (aim) {
      freezeGrowth();
      aim.lm = aimLm() - dy * 0.0012;
      return;
    }
    zoomAt(e.offsetX, e.offsetY, cam.z * Math.exp(-dy * 0.0015));
  }, { passive: false });

  // ---------------------------------------------------------------------------
  // UI wiring
  // ---------------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const feed = $('feed');
  const hint = $('hint');
  const card = $('card'), cTitle = $('cTitle'), cGlyph = $('cGlyph'), cStats = $('cStats'), cNote = $('cNote'), cFollow = $('cFollow'), cSupernova = $('cSupernova');
  const rTime = $('rTime'), rBodies = $('rBodies'), rDust = $('rDust'), rHeavy = $('rHeavy'), rLife = $('rLife');
  const scaleLabel = $('scaleLabel'), scaleBar = $('scaleBar');
  const toolBtns = [...document.querySelectorAll('[data-tool]')];
  const speedIn = $('speed'), speedOut = $('speedLabel');

  hint.innerHTML = coarse
    ? 'Touch and hold to place a <b id="hintTool">planet</b>, then drag to throw it.<small>Hold longer to make it bigger · Drag to move · Tap to inspect · ? for help</small>'
    : `Hold <b>${MOD}</b> and drag to throw a <b id="hintTool">planet</b>.<small>Hold still first to make it bigger · Drag to move · Click to inspect · ? for help</small>`;

  // The hint leaves after the first throw, or after 20 seconds; the ? button
  // (or H) brings it back along with the scene's description.
  let hintTimer = setTimeout(() => hint.classList.add('gone'), 20000);
  // Where there's no room beside the title, the hint goes just under the
  // readout, measured, so a readout line that wraps can't run into it.
  function placeHint() {
    // While the inspector is open on a narrow screen the brand (and its
    // readout) are hidden, so measuring it would put the hint at the top of
    // the stage, on top of the scene picker. The hint is hidden by CSS in
    // that state anyway, so just leave its position alone.
    if (VW > 1100 || topBar.classList.contains('inspecting')) { hint.style.top = ''; return; }
    hint.style.top = Math.round(document.querySelector('.brand').getBoundingClientRect().bottom - stage.getBoundingClientRect().top + 10) + 'px';
  }
  function showHelp() {
    placeHint();
    hint.classList.remove('gone');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add('gone'), 12000);
    // Empty space's blurb says there's nothing here yet; once something has
    // been placed that's no longer true, so don't repeat it.
    if (sceneKey !== 'empty' || !spawned) pushEvent(SCENES[sceneKey].blurb, 'info', 'blurb', 1500);
  }
  // Most people try a plain drag first. The first time that moves the view
  // before anything has been thrown, explain how to throw.
  let dragTipShown = false;
  function dragTip() {
    if (spawned || dragTipShown) return;
    dragTipShown = true;
    pushEvent(coarse ? 'Dragging moves the view. To throw, touch and hold first, then drag.'
      : `Dragging moves the view. To throw something, hold ${MOD} while you drag.`, 'info');
  }

  const lastEv = {};
  function pushEvent(text, tone, key, gap) {
    const now = performance.now();
    if (key) {
      if (lastEv[key] && now - lastEv[key] < gap) return;
      lastEv[key] = now;
    }
    const li = document.createElement('li');
    const dot = document.createElement('i');
    dot.className = 't-' + tone;
    const span = document.createElement('span');
    span.textContent = text;
    li.append(dot, span);
    feed.appendChild(li);
    while (feed.children.length > 4) feed.firstElementChild.remove();
    setTimeout(() => li.classList.add('out'), tone === 'info' ? 10000 : 6500);
    setTimeout(() => li.remove(), tone === 'info' ? 10900 : 7400);
  }

  const setPressed = (id, v) => $(id).setAttribute('aria-pressed', String(v));
  function setTool(t) {
    tool = t;
    for (const b of toolBtns) b.setAttribute('aria-pressed', String(b.dataset.tool === t));
    const el = $('hintTool');
    if (el) el.textContent = TOOLS[t].name;
  }
  // The speed slider is logarithmic: every step changes the rate by the same
  // percentage, from hours a second to more than a year a second.
  const SPEED_STEPS = 1000;
  const rateToPos = r => Math.round(SPEED_STEPS * Math.log(r / RATE_MIN) / Math.log(RATE_MAX / RATE_MIN));
  const posToRate = p => RATE_MIN * Math.pow(RATE_MAX / RATE_MIN, p / SPEED_STEPS);
  function fmtRate(r) {
    const d = r / YEAR * 365.25;
    if (d < 1) { const h = d * 24; return h.toFixed(h < 10 ? 1 : 0) + ' hr/s'; }
    if (d < 60) return d.toFixed(d < 10 ? 1 : 0) + ' days/s';
    if (d < 365.25) return (d / 30.44).toFixed(1) + ' mo/s';
    return (d / 365.25).toFixed(2) + ' yr/s';
  }
  function setRate(r, fromSlider) {
    rate = clamp(r, RATE_MIN, RATE_MAX);
    const p = rateToPos(rate);
    if (!fromSlider) speedIn.value = p;
    speedIn.style.setProperty('--p', (100 * p / SPEED_STEPS) + '%');
    const txt = fmtRate(rate);
    speedOut.textContent = txt;
    speedIn.setAttribute('aria-valuetext', txt.replace('/s', ' per second'));
  }
  const nudgeRate = steps => setRate(posToRate(rateToPos(rate) + steps));
  function togglePause() {
    paused = !paused;
    $('icoPause').hidden = paused;
    $('icoPlay').hidden = !paused;
    $('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
    setPressed('pause', paused);
  }
  function toggleTrails() { showTrails = !showTrails; setPressed('trails', showTrails); }
  function toggleWarp() { showWarp = !showWarp; setPressed('warp', showWarp); }
  function toggleZones() { showZones = !showZones; setPressed('zones', showZones); }
  function toggleAssist() { orbitAssist = !orbitAssist; setPressed('assist', orbitAssist); }

  function setFollow(v) {
    follow = v && !!selected;
    followK = 0;
    cFollow.setAttribute('aria-pressed', String(follow));
    if (follow) cam.target = null;
  }
  const topBar = document.querySelector('.top');
  function select(b) {
    selected = b;
    card.hidden = false;
    topBar.classList.add('inspecting');
    setFollow(true);
    updateCard();
  }
  function deselect() {
    selected = null;
    follow = false;
    card.hidden = true;
    topBar.classList.remove('inspecting');
  }

  function updateCard() {
    if (!selected) return;
    const b = selected;
    const rows = [];
    let note = '';
    cTitle.textContent = kindName(b);
    cGlyph.className = 'glyph ' + (b.icy ? 'g-comet' : b.kind === 'star' ? 'g-star' : b.kind === 'bh' ? 'g-bh' : b.life ? 'g-life' : 'g-planet');
    // planets show their own colors in the inspector
    cGlyph.style.background = b.kind === 'planet' && !b.icy
      ? `radial-gradient(circle at 34% 32%, rgb(${lighten(b.rgb, 0.5)}), rgb(${b.rgbStr}) 55%, rgb(${b.altStr}) 100%)`
      : '';

    if (!b.icy) rows.push(['Mass', massLabel(b.m, b.kind)]);
    cSupernova.hidden = true;
    if (b.kind === 'star') {
      const s = b.m / MSUN, Tk = Math.round(5778 * Math.pow(s, 0.54) / 10) * 10;
      rows.push(['Class', `${spectral(Tk)} · ${Tk.toLocaleString()} K`]);
      rows.push(['Light', `${fmtNum(b.lum)} L☉`]);
      const hi = 0.95 * Math.sqrt(b.lum), ho = 1.55 * Math.sqrt(b.lum);
      // past the edge of the universe (150 AU) nothing can orbit there
      rows.push(['Habitable', hi * AU > FAR ? 'Too far out' : `${fmtNum(hi)}–${fmtNum(ho)} AU`]);
      note = s >= COLLAPSE / MSUN
        ? 'A very massive star. If it collides with another star, it collapses into a black hole in a supernova. Or trigger one now.'
        : s >= 8
        ? `A heavy star. Merge it past 20 M☉ and it collapses into a black hole in a supernova.`
        : `Planets between ${fmtNum(hi)} and ${fmtNum(ho)} AU get the right amount of light for liquid water.`;
      cSupernova.hidden = !(s >= COLLAPSE / MSUN);
    } else if (b.kind === 'bh') {
      const rs = 2.953 * b.m / MSUN;
      rows.push(['Horizon', `${rs.toFixed(1)} km radius`]);
      note = 'Nothing that crosses the bright ring comes back. Stars that pass within its tidal radius get shredded first.';
    } else if (b.icy) {
      note = 'An icy nucleus. Near a star it grows a blue ion tail that points straight away from the star, plus a curved dust tail. The dust it sheds spreads along its orbit, like the streams behind real meteor showers.';
    } else {
      const F = b.flux, Tk = Math.round(278.6 * Math.pow(Math.max(F, 1e-6), 0.25));
      rows.push(['Temp', `${Tk} K · ${Math.round(Tk - 273.15)} °C`]);
      const inZone = F >= HZ_LO && F <= HZ_HI;
      rows.push(['Zone', inZone ? 'Habitable' : F > HZ_HI ? 'Too hot' : 'Too cold']);
      rows.push(['Life', STAGE_NAME[b.life], b.life ? 'alive' : '']);
      if (b.m > DWARF) note = 'A brown dwarf: too heavy to count as a planet, too light to burn hydrogen like a star.';
      else if (b.m < LIFE_MIN) note = `Too light for life in this sandbox: worlds need at least ${massLabel(LIFE_MIN, 'planet')}.`;
      else if (b.life === 3) note = 'A spacefaring civilization. Watch for the green probes it launches.';
      else if (b.life === 2) note = 'A civilization. Zoom in to see its city lights on the night side.';
      else if (b.life === 1) note = `Simple life has taken hold. A civilization needs about ${Math.max(0, (LIFE_T[1] - b.hz) / YEAR).toFixed(1)} more years in the zone.`;
      else if (inZone) note = `Liquid water is possible here. Life needs about ${Math.max(0, (LIFE_T[0] - b.hz) / YEAR).toFixed(1)} more years in the zone.`;
      else note = F > HZ_HI ? 'Too much starlight: any water boils off.' : 'Too little starlight: any water freezes solid.';
    }

    const p = primaryOf(b);
    if (p) {
      const o = orbitOf(b, p);
      rows.push(['Orbits', o.bound ? `${kindName(p)} · ${massLabel(p.m, p.kind)}` : 'Nothing (escaping)']);
      rows.push(['Distance', `${(o.r / AU).toFixed(2)} AU`]);
      if (o.bound) {
        rows.push(['Period', fmtTime(o.P)]);
        rows.push(['Eccentricity', o.e.toFixed(2)]);
      }
      rows.push(['Speed', `${(o.v * KMS).toFixed(1)} km/s`]);
    } else {
      rows.push(['Orbits', 'Nothing']);
      rows.push(['Speed', `${(Math.hypot(b.vx, b.vy) * KMS).toFixed(1)} km/s`]);
    }
    cStats.innerHTML = rows.map(([k, v, cls]) => `<dt>${k}</dt><dd${cls ? ` class="${cls}"` : ''}>${v}</dd>`).join('');
    cNote.textContent = note;
  }

  for (const b of toolBtns) b.addEventListener('click', () => setTool(b.dataset.tool));
  speedIn.addEventListener('input', () => setRate(posToRate(+speedIn.value), true));
  speedOut.addEventListener('click', () => setRate(RATE_DEFAULT));
  $('pause').addEventListener('click', togglePause);
  $('trails').addEventListener('click', toggleTrails);
  $('warp').addEventListener('click', toggleWarp);
  $('zones').addEventListener('click', toggleZones);
  $('assist').addEventListener('click', toggleAssist);
  $('center').addEventListener('click', centerView);
  $('restart').addEventListener('click', () => loadScene(sceneKey, true));
  $('help').addEventListener('click', showHelp);
  $('scene').addEventListener('change', e => { loadScene(e.target.value); e.target.blur(); });
  cFollow.addEventListener('click', () => setFollow(!follow));
  $('cClose').addEventListener('click', deselect);
  cSupernova.addEventListener('click', () => {
    if (selected && selected.kind === 'star' && selected.m >= COLLAPSE) {
      supernova(selected);
      updateCard();
    }
  });

  addEventListener('keydown', e => {
    if (e.key === 'Control' || e.key === 'Meta') { setMod(true); return; }
    if (e.target.closest && e.target.closest('select')) return;
    if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    // Esc and Space work even while Ctrl or ⌘ is held for a throw
    if (e.key === 'Escape') { if (aim) { aim = null; updateCursor(); } else deselect(); return; }
    if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
    // AltGr counts as Ctrl+Alt on Windows, so let it through for [ and ]
    const altGr = e.getModifierState && e.getModifierState('AltGraph');
    if ((e.metaKey || e.ctrlKey || e.altKey) && !altGr) return;
    // Match the typed character first, so [ ] + - and letters work wherever a
    // layout puts them (AltGr, Dvorak and QWERTZ included). The physical key is
    // only a fallback for the digit row (AZERTY types & é " ' ( there) and for
    // letters on non-Latin layouts, never for a Latin letter that simply has no
    // shortcut, so Dvorak's P can't restart the scene.
    const ACTIONS = {
      '1': () => setTool('planet'), '2': () => setTool('comet'), '3': () => setTool('star'),
      '4': () => setTool('bh'), '5': () => setTool('dust'),
      '[': () => nudgeRate(-25), ']': () => nudgeRate(25),
      t: toggleTrails, g: toggleWarp, z: toggleZones, o: toggleAssist,
      f: centerView, r: () => loadScene(sceneKey, true), h: showHelp, '?': showHelp,
      '=': () => zoomAt(VW / 2, VH / 2, cam.z * 1.25), '+': () => zoomAt(VW / 2, VH / 2, cam.z * 1.25),
      '-': () => zoomAt(VW / 2, VH / 2, cam.z / 1.25), '_': () => zoomAt(VW / 2, VH / 2, cam.z / 1.25)
    };
    const DIGITS = { Digit1: '1', Digit2: '2', Digit3: '3', Digit4: '4', Digit5: '5' };
    const LETTERS = { KeyT: 't', KeyG: 'g', KeyZ: 'z', KeyO: 'o', KeyF: 'f', KeyR: 'r', KeyH: 'h' };
    const nonLatin = e.key.length === 1 && e.key.charCodeAt(0) > 0x7e;
    const act = ACTIONS[e.key.toLowerCase()] || ACTIONS[DIGITS[e.code]] || (nonLatin ? ACTIONS[LETTERS[e.code]] : null);
    if (act) act();
  });
  // A mouse click leaves a button focused, and the browser would then give it
  // Space and Enter (Space would restart the scene after clicking Restart).
  // Keyboard users keep their focus: their clicks have detail 0.
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button');
    if (b && e.detail > 0) b.blur();
  });
  addEventListener('keyup', e => { if (e.key === 'Control' || e.key === 'Meta') setMod(false); });
  addEventListener('blur', () => setMod(false));

  function updateHud() {
    rTime.textContent = fmtTime(simTime);
    rBodies.textContent = bodies.length.toLocaleString();
    rDust.textContent = T.n.toLocaleString();
    let h = null, alive = 0, civ = 0;
    for (const b of bodies) {
      if (!h || b.m > h.m) h = b;
      if (b.life) alive++;
      if (b.life >= 2) civ++;
    }
    rHeavy.innerHTML = h ? `${kindName(h)} <span class="nowrap">· ${massLabel(h.m, h.kind)}</span>` : '—';
    rLife.textContent = alive ? `${alive} ${alive === 1 ? 'world' : 'worlds'}${civ ? ` · ${civ} civ.` : ''}` : 'None yet';
    rLife.classList.toggle('alive', alive > 0);

    const steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    let pick = steps[0];
    for (const s of steps) if (s * AU * cam.z <= 140) pick = s;
    scaleBar.style.width = Math.round(pick * AU * cam.z) + 'px';
    scaleLabel.textContent = pick + ' AU';
  }

  // ---------------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------------
  function drawTrail(b, alpha) {
    const tl = b.tl;
    if (tl < 2) return;
    const start = (b.th - tl + TRAIL) % TRAIL;
    const bands = 3;
    for (let s = 0; s < bands; s++) {
      const k0 = Math.floor(s * (tl - 1) / bands), k1 = Math.floor((s + 1) * (tl - 1) / bands);
      ctx.beginPath();
      for (let k = k0; k <= k1; k++) {
        const i = ((start + k) % TRAIL) * 2;
        const X = sx(b.trail[i]), Y = sy(b.trail[i + 1]);
        if (k === k0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      if (s === bands - 1) ctx.lineTo(sx(b.x), sy(b.y));
      ctx.strokeStyle = `rgba(${b.rgbStr},${alpha * (s + 1) / bands})`;
      ctx.stroke();
    }
  }

  let GX = new Float32Array(0), GY = new Float32Array(0);
  function drawWarp() {
    const wells = bodies.filter(b => b.m >= 2000);
    const waves = effects.filter(f => f.kind === 'wave');
    const gs = Math.pow(2, Math.round(Math.log2(46 / cam.z)));
    const gx0 = Math.floor(wx(-60) / gs) * gs, gy0 = Math.floor(wy(-60) / gs) * gs;
    const cols = Math.ceil((wx(VW + 60) - gx0) / gs) + 1, rows = Math.ceil((wy(VH + 60) - gy0) / gs) + 1;
    const n = cols * rows;
    if (n > 9000) return;
    if (GX.length < n) { GX = new Float32Array(n); GY = new Float32Array(n); }
    const ww = 40 / cam.z;
    for (let r = 0; r < rows; r++) {
      const y = gy0 + r * gs;
      for (let c = 0; c < cols; c++) {
        const x = gx0 + c * gs;
        let dx = 0, dy = 0;
        for (let k = 0; k < wells.length; k++) {
          const w = wells[k];
          const ex = w.x - x, ey = w.y - y, d = Math.sqrt(ex * ex + ey * ey) + 0.001;
          const pull = Math.min(0.8 * d, 0.35 * w.m / (d + 40));
          dx += ex / d * pull; dy += ey / d * pull;
        }
        for (let k = 0; k < waves.length; k++) {
          const f = waves[k];
          const ex = x - f.x, ey = y - f.y, d = Math.sqrt(ex * ex + ey * ey) + 0.001;
          const q = (d - f.rad) / ww;
          if (q < -3 || q > 3) continue;
          const amp = (f.size / cam.z) * (f.life / f.max) * Math.exp(-q * q) * Math.sin(q * 4);
          dx += ex / d * amp; dy += ey / d * amp;
        }
        const i = r * cols + c;
        GX[i] = sx(x + dx); GY[i] = sy(y + dy);
      }
    }
    ctx.beginPath();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        if (c === 0) ctx.moveTo(GX[i], GY[i]); else ctx.lineTo(GX[i], GY[i]);
      }
    }
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        const i = r * cols + c;
        if (r === 0) ctx.moveTo(GX[i], GY[i]); else ctx.lineTo(GX[i], GY[i]);
      }
    }
    ctx.strokeStyle = 'rgba(127,182,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawZones() {
    ctx.font = '500 10px "IBM Plex Mono", ui-monospace, monospace';
    for (const s of lights) {
      const sq = Math.sqrt(s.lum);
      const ri = 0.95 * sq * AU * cam.z, ro = 1.55 * sq * AU * cam.z;
      if (ro < 8 || ri > 3 * Math.max(VW, VH)) continue;
      const X = sx(s.x), Y = sy(s.y);
      if (X + ro < 0 || Y + ro < 0 || X - ro > VW || Y - ro > VH) continue;
      ctx.fillStyle = 'rgba(110,220,160,0.07)';
      ctx.beginPath();
      ctx.arc(X, Y, ro, 0, 6.283);
      ctx.arc(X, Y, ri, 0, 6.283, true);
      ctx.fill();
      ctx.strokeStyle = 'rgba(110,220,160,0.24)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(X, Y, ro, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(X, Y, ri, 0, 6.283); ctx.stroke();
      if (ro - ri > 14) {
        ctx.fillStyle = 'rgba(127,224,176,0.8)';
        ctx.textAlign = 'center';
        // Keep the label out from under the readout HUD, which sits on top
        // of the canvas at the top of the screen (mainly a phone-width issue).
        const labelY = Math.max(Y - (ri + ro) / 2 + 3, Math.min(Y + ro - 3, hudBottom + 12));
        ctx.fillText('HABITABLE ZONE', X, labelY);
        ctx.textAlign = 'start';
      }
    }
  }

  function drawOrbit(b) {
    const p = primaryOf(b);
    if (!p) return;
    const o = orbitOf(b, p);
    if (!o.bound || o.e >= 0.999 || o.a * cam.z > 40000) return;
    const bb = o.a * Math.sqrt(1 - o.e * o.e);
    const cx = p.x - o.a * o.ex, cy = p.y - o.a * o.ey;
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(244,184,96,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(sx(cx), sy(cy), o.a * cam.z, bb * cam.z, Math.atan2(o.ey, o.ex), 0, 6.283);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawTracers() {
    ctx.lineWidth = 1.3;
    ctx.lineCap = 'round';
    const pad = 20;
    const paths = [];
    for (let i = 0; i < T.n; i++) {
      const X = sx(T.x[i]), Y = sy(T.y[i]);
      if (X < -pad || Y < -pad || X > VW + pad || Y > VH + pad) continue;
      let PX = sx(T.px[i]), PY = sy(T.py[i]);
      if (Math.abs(PX - X) + Math.abs(PY - Y) < 0.6) PX = X - 0.6;
      const c = T.c[i];
      const path = paths[c] || (paths[c] = new Path2D());
      path.moveTo(PX, PY);
      path.lineTo(X, Y);
    }
    for (let c = 0; c < paths.length; c++) {
      if (!paths[c]) continue;
      ctx.strokeStyle = `rgba(${TRACER_RGB[c]},${c === PROBE_COLOR ? 1 : 0.8})`;
      ctx.stroke(paths[c]);
    }
    ctx.lineCap = 'butt';
  }

  function onScreen(X, Y, m) { return X > -m && Y > -m && X < VW + m && Y < VH + m; }

  function drawComet(b, X, Y) {
    const { F, best } = fluxAt(b.x, b.y);
    const k = Math.cbrt(b.m / 0.5);
    if (!best) { drawSprite(COMA, X, Y, 10 * k, 0.6); return; }
    let ax = b.x - best.x, ay = b.y - best.y;
    const ad = Math.hypot(ax, ay) || 1;
    ax /= ad; ay /= ad;
    const len = AU * 0.35 * Math.min(3, Math.sqrt(F)) * Math.sqrt(k) * cam.z;
    if (len > 3) {
      const ex = X + ax * len, ey = Y + ay * len;
      let g = ctx.createLinearGradient(X, Y, ex, ey);
      g.addColorStop(0, 'rgba(170,210,255,0.8)');
      g.addColorStop(1, 'rgba(170,210,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = clamp(len * 0.03, 1, 3);
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(ex, ey); ctx.stroke();
      const v = Math.hypot(b.vx, b.vy) || 1;
      let tx = ax - 0.6 * b.vx / v, ty = ay - 0.6 * b.vy / v;
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const dx2 = X + tx * len * 0.75, dy2 = Y + ty * len * 0.75;
      g = ctx.createLinearGradient(X, Y, dx2, dy2);
      g.addColorStop(0, 'rgba(255,228,190,0.55)');
      g.addColorStop(1, 'rgba(255,228,190,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = clamp(len * 0.06, 1.5, 6);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.quadraticCurveTo(X + ax * len * 0.4, Y + ay * len * 0.4, dx2, dy2); ctx.stroke();
      ctx.lineCap = 'butt';
    }
    drawSprite(COMA, X, Y, (10 + Math.min(30, F * 6)) * k, 0.9);
  }

  function drawLife(b, X, Y, R, lx, ly) {
    const t = performance.now() / 1000;
    if (b.life >= 2 && R >= 3.5 && (lx || ly)) {
      const base = Math.atan2(-ly, -lx);
      const s = Math.max(0.9, R * 0.09);
      for (let k = 0; k < 8; k++) {
        const h1 = hash(b.id, k), h2 = hash(b.id, k + 17);
        const ang = base + (h1 - 0.5) * 2.0, rr = R * (0.2 + 0.65 * h2);
        const a = reduceMotion ? 0.85 : 0.55 + 0.45 * Math.sin(t * (1.5 + h1 * 2) + k);
        ctx.fillStyle = `rgba(255,214,130,${a.toFixed(2)})`;
        ctx.fillRect(X + Math.cos(ang) * rr - s / 2, Y + Math.sin(ang) * rr - s / 2, s, s);
      }
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = b.life >= 2 ? 'rgba(244,184,96,0.8)' : 'rgba(127,224,176,0.75)';
    if (b.life === 1) ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.arc(X, Y, R + 3, 0, 6.283); ctx.stroke();
    ctx.setLineDash([]);
    if (b.life >= 3) {
      const a = t * 2 + b.id;
      ctx.fillStyle = '#9fffd8';
      ctx.beginPath(); ctx.arc(X + Math.cos(a) * (R + 6), Y + Math.sin(a) * (R + 6), 1.3, 0, 6.283); ctx.fill();
    }
  }

  // Close up, gas giants show bands and rocky worlds show surface patches
  // (continents, seas, ice or magma), all shaded from the brightest star.
  function drawSurface(b, X, Y, R) {
    ctx.save();
    ctx.beginPath(); ctx.arc(X, Y, R, 0, 6.283); ctx.clip();
    ctx.fillStyle = `rgb(${b.rgbStr})`;
    ctx.fillRect(X - R, Y - R, R * 2, R * 2);
    ctx.fillStyle = `rgba(${b.altStr},${b.bands ? 0.42 : 0.55})`;
    if (b.bands) {
      ctx.translate(X, Y);
      ctx.rotate(b.tilt);
      for (let k = 0; k < 6; k++) {
        const y0 = (hash(b.id, k) * 2 - 1) * R, h = R * (0.06 + 0.16 * hash(b.id, k + 9));
        ctx.fillRect(-R, y0 - h / 2, R * 2, h);
      }
    } else {
      for (let k = 0; k < 5; k++) {
        const a = hash(b.id, k) * 6.283, d = R * 0.75 * hash(b.id, k + 5), s = R * (0.2 + 0.32 * hash(b.id, k + 11));
        ctx.beginPath(); ctx.arc(X + Math.cos(a) * d, Y + Math.sin(a) * d, s, 0, 6.283); ctx.fill();
      }
    }
    ctx.restore();
  }
  function drawPlanet(b, X, Y, R) {
    if (b.icy) {
      ctx.fillStyle = '#eef6ff';
      ctx.beginPath(); ctx.arc(X, Y, Math.max(1.1, R), 0, 6.283); ctx.fill();
      return;
    }
    let lx = 0, ly = 0, best = 0;
    for (const s of lights) {
      const dx = s.x - b.x, dy = s.y - b.y, d2 = dx * dx + dy * dy + 1;
      const w = s.lum / d2;
      if (w > best) { best = w; const d = Math.sqrt(d2); lx = dx / d; ly = dy / d; }
    }
    if (R >= 4) drawSurface(b, X, Y, R);
    else {
      ctx.fillStyle = `rgb(${b.rgbStr})`;
      ctx.beginPath(); ctx.arc(X, Y, R, 0, 6.283); ctx.fill();
    }
    if (R >= 2.4 && best) {
      const g = ctx.createRadialGradient(X + lx * R * 0.45, Y + ly * R * 0.45, R * 0.1, X, Y, R * 1.05);
      g.addColorStop(0, 'rgba(255,255,255,0.3)');
      g.addColorStop(0.42, 'rgba(255,255,255,0)');
      g.addColorStop(1, 'rgba(6,8,16,0.9)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(X, Y, R, 0, 6.283); ctx.fill();
    }
    if (b.life) drawLife(b, X, Y, R, lx, ly);
  }

  function drawBlackHole(b, X, Y) {
    const R = visR(b);
    const heat = Math.min(1, b.feed / 120);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(X, Y, R, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = Math.max(1, R * 0.16);
    ctx.strokeStyle = `rgba(${b.ringStr},${0.5 + heat * 0.45})`;
    ctx.beginPath(); ctx.arc(X, Y, R * 1.3, 0, 6.283); ctx.stroke();
    // accretion arcs: a wide faint halo, a mid band and a bright thin core,
    // so they glow and fade at the edges instead of reading as flat bands
    ctx.lineCap = 'round';
    const glow = 0.6 + heat * 0.9;
    for (let k = 0; k < 2; k++) {
      const a = b.spin + k * Math.PI;
      for (const [w, al, col] of [[0.75, 0.06, b.rgbStr], [0.42, 0.12, b.rgbStr], [0.14, 0.34, b.ringStr]]) {
        ctx.lineWidth = Math.max(1, R * w);
        ctx.strokeStyle = `rgba(${col},${Math.min(1, al * glow).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(X, Y, R * 2, a, a + 1.3); ctx.stroke();
      }
    }
    ctx.lineCap = 'butt';
  }

  function drawSprite(sprite, X, Y, S, alpha) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprite, X - S / 2, Y - S / 2, S, S);
    ctx.globalAlpha = 1;
  }

  function drawSelection() {
    if (!selected) return;
    const b = selected;
    const X = sx(b.x), Y = sy(b.y);
    const R = Math.max(6, visR(b)) + 7, L = Math.min(8, R * 0.6);
    ctx.strokeStyle = 'rgba(244,184,96,0.95)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const [ux, uy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const cx = X + ux * R, cy = Y + uy * R;
      ctx.moveTo(cx, cy - uy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx - ux * L, cy);
    }
    ctx.stroke();
  }

  // The object about to be placed, at screen point (X0, Y0). Returns its radius in px.
  function drawGhost(X0, Y0, m) {
    if (tool === 'dust') {
      const R = cloudR(m) * cam.z * 0.5;
      ctx.setLineDash([2, 4]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = `rgba(${TRACER_RGB[aim.fam[0]]},0.7)`;
      ctx.beginPath(); ctx.arc(X0, Y0, R, 0, 6.283); ctx.stroke();
      ctx.setLineDash([]);
      return R;
    }
    if (tool === 'comet') {
      const k = Math.cbrt(m / 0.5);
      ctx.globalCompositeOperation = 'lighter';
      drawSprite(COMA, X0, Y0, 16 * k, 0.9);
      ctx.globalCompositeOperation = 'source-over';
      return 2 * k;
    }
    const rgb = tool === 'star' ? starRGB(m) : tool === 'bh' ? [140, 180, 255] : PLANET_STYLES[aimStyle(m)].rgb;
    const R = Math.max(tool === 'bh' ? 2.5 : 1.8, radiusFor(m, tool) * cam.z);
    ctx.globalCompositeOperation = 'lighter';
    if (tool !== 'planet') drawSprite(glowSprite(rgb), X0, Y0, glowSize(R, tool), 0.8);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = tool === 'bh' ? '#000' : `rgb(${lighten(rgb, tool === 'star' ? 0.5 : 0.1)})`;
    ctx.beginPath(); ctx.arc(X0, Y0, R, 0, 6.283); ctx.fill();
    if (tool === 'bh') {
      ctx.strokeStyle = 'rgba(255,222,180,0.9)';
      ctx.lineWidth = Math.max(1, R * 0.16);
      ctx.beginPath(); ctx.arc(X0, Y0, R * 1.3, 0, 6.283); ctx.stroke();
    }
    return R;
  }

  // A ring around the ghost that fills from the tool's lightest to heaviest.
  function drawMeter(X0, Y0, r) {
    const [lo, hi] = lmRange();
    const f = (aimLm() - lo) / (hi - lo || 1);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(233,228,216,0.14)';
    ctx.beginPath(); ctx.arc(X0, Y0, r, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = aim.grow ? 'rgba(244,184,96,0.95)' : 'rgba(244,184,96,0.65)';
    ctx.beginPath(); ctx.arc(X0, Y0, r, -Math.PI / 2, -Math.PI / 2 + f * 6.283); ctx.stroke();
  }

  function drawTag(X0, Y0, R, label) {
    ctx.font = '500 11px "IBM Plex Mono", ui-monospace, monospace';
    const tw = ctx.measureText(label).width;
    let LX = X0 + R + 12, LY = Y0 - R - 8;
    if (LX + tw > VW - 16) LX = X0 - R - 12 - tw;
    if (LY < 20) LY = Y0 + R + 18;
    LX = clamp(LX, 16, VW - 16 - tw);
    LY = clamp(LY, 20, VH - 12);
    ctx.fillStyle = 'rgba(4,5,10,0.7)';
    ctx.fillRect(LX - 6, LY - 12, tw + 12, 18);
    ctx.fillStyle = '#e9e4d8';
    ctx.fillText(label, LX, LY + 1);
  }

  // Holding Ctrl with the mouse over the sky shows where a throw would start.
  function drawPreview() {
    const d = TOOLS[tool];
    const X0 = hover.x, Y0 = hover.y;
    const R = tool === 'dust' ? cloudR(d.base) * cam.z * 0.5 : Math.max(5, tool === 'comet' ? 2 : radiusFor(d.base, tool) * cam.z);
    ctx.setLineDash([3, 4]);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(244,184,96,0.75)';
    ctx.beginPath(); ctx.arc(X0, Y0, R, 0, 6.283); ctx.stroke();
    ctx.setLineDash([]);
    drawTag(X0, Y0, R, `Drag to throw a ${d.name}`);
  }

  // A touch that rests in place charges a ring, then turns into a placement.
  function drawPress() {
    if (!pan || !pan.touch || pan.moved) return;
    const t = (performance.now() - pan.t0) / LONG_PRESS;
    const p = pointers.get(pan.id);
    if (t < 0.3 || !p) return;
    const k = Math.min(1, (t - 0.3) / 0.7);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = `rgba(244,184,96,${(0.25 + 0.65 * k).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 34, -Math.PI / 2, -Math.PI / 2 + k * 6.283); ctx.stroke();
  }

  function drawAim() {
    if (!aim) {
      if (modDown && hover && !pan) drawPreview();
      drawPress();
      return;
    }
    const m = aimMass();
    const v = aimVel();
    const assist = assistOn() && aim.primary && !aim.primary.dead;
    const X0 = sx(aim.wx), Y0 = sy(aim.wy);
    const p = aim.primary && !aim.primary.dead ? aim.primary : null;

    // predicted path, in the frame of whatever it will orbit
    const pts = predict(aim.wx, aim.wy, v.x - (p ? p.vx : 0), v.y - (p ? p.vy : 0));
    const half = Math.floor(pts.length / 4) * 2;
    ctx.lineWidth = 1.3;
    ctx.setLineDash([3, 6]);
    for (let s = 0; s < 2; s++) {
      const a = s === 0 ? 0 : half, z = s === 0 ? half + 2 : pts.length;
      if (z - a < 4) continue;
      ctx.beginPath();
      for (let i = a; i < z; i += 2) {
        const X = sx(pts[i]), Y = sy(pts[i + 1]);
        if (i === a) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.strokeStyle = s === 0 ? 'rgba(244,184,96,0.85)' : 'rgba(244,184,96,0.35)';
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // drag vector
    const dx = aim.cx - aim.sx, dy = aim.cy - aim.sy, dl = Math.hypot(dx, dy);
    if (dl > 6 && !assist) {
      ctx.strokeStyle = 'rgba(233,228,216,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(aim.cx, aim.cy); ctx.stroke();
      const ux = dx / dl, uy = dy / dl;
      ctx.beginPath();
      ctx.moveTo(aim.cx, aim.cy);
      ctx.lineTo(aim.cx - ux * 8 - uy * 4, aim.cy - uy * 8 + ux * 4);
      ctx.lineTo(aim.cx - ux * 8 + uy * 4, aim.cy - uy * 8 - ux * 4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(233,228,216,0.6)';
      ctx.fill();
    }

    const R = drawGhost(X0, Y0, m);
    const ring = Math.max(R + 7, 12);
    drawMeter(X0, Y0, ring);
    let label = tool === 'dust' ? `${m.toLocaleString()} particles` : tool === 'comet' ? 'Comet' : massLabel(m, tool);
    if (assist) label += '  ·  circular orbit';
    else label += `  ·  ${(Math.hypot(v.x, v.y) * KMS).toFixed(1)} km/s`;
    drawTag(X0, Y0, ring, label);
  }

  function render() {
    const ox0 = shake > 0.3 ? (Math.random() - 0.5) * shake : 0;
    const oy0 = shake > 0.3 ? (Math.random() - 0.5) * shake : 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (backdrop.width && backdrop.height) ctx.drawImage(backdrop, 0, 0, VW, VH);
    const S = 512;
    const ox = (((-cam.x * 0.03) % S) + S) % S - S;
    const oy = (((-cam.y * 0.03) % S) + S) % S - S;
    // Nearest-neighbour for the star tile: bilinear resampling at the fractional
    // parallax offset is costly on phones. Restored for the scaled glow sprites.
    ctx.imageSmoothingEnabled = false;
    for (let x = ox; x < VW; x += S) for (let y = oy; y < VH; y += S) ctx.drawImage(starTile, x, y);
    ctx.imageSmoothingEnabled = true;
    ctx.setTransform(dpr, 0, 0, dpr, ox0 * dpr, oy0 * dpr);

    if (showWarp) drawWarp();
    if (showZones) drawZones();

    if (showTrails) {
      ctx.lineWidth = 1;
      for (const b of bodies) {
        const a = b.icy ? 0.3 : b.kind === 'planet' ? (b.m < 10 ? 0.16 : 0.45) : b.kind === 'bh' ? 0.4 : 0.5;
        drawTrail(b, a);
      }
    }
    if (selected) drawOrbit(selected);

    // additive layer: dust, glows, tails, effects
    ctx.globalCompositeOperation = 'lighter';
    drawTracers();
    for (const b of bodies) {
      if (b.kind === 'planet') {
        if (!b.icy) continue;
        const X = sx(b.x), Y = sy(b.y);
        if (onScreen(X, Y, 300)) drawComet(b, X, Y);
        continue;
      }
      const X = sx(b.x), Y = sy(b.y);
      const R = visR(b);
      const size = glowSize(R, b.kind);
      if (!onScreen(X, Y, size)) continue;
      const a = b.kind === 'bh' ? 0.3 + Math.min(1, b.feed / 120) * 0.45 : 0.9;
      drawSprite(b.sprite, X, Y, size, a);
    }
    for (const f of effects) {
      const t = f.life / f.max;
      const X = sx(f.x), Y = sy(f.y);
      if (f.kind === 'ring') {
        const r = Math.max(3, f.size * cam.z) * (1 + 3.5 * (1 - t));
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = `rgba(${f.rgb},${(0.8 * t).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.283); ctx.stroke();
      } else if (f.kind === 'wave') {
        ctx.lineWidth = 1.2;
        for (let k = 0; k < 3; k++) {
          const r = (f.rad - k * 26 / cam.z) * cam.z;
          if (r <= 0) continue;
          ctx.strokeStyle = `rgba(${f.rgb},${(0.35 * t * (1 - k * 0.3)).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.283); ctx.stroke();
        }
      } else {
        const s = Math.min(Math.max(VW, VH) * 1.5, Math.max(20, f.size * cam.z * 6) * (1 + (1 - t)));
        drawSprite(glowSprite(f.rgb.split(',').map(Number)), X, Y, s, t);
      }
    }

    // solid bodies
    ctx.globalCompositeOperation = 'source-over';
    for (const b of bodies) {
      if (b.kind === 'bh') continue;
      const X = sx(b.x), Y = sy(b.y);
      const R = visR(b);
      if (!onScreen(X, Y, R + 10)) continue;
      if (b.kind === 'planet') drawPlanet(b, X, Y, R);
      else {
        if (R > 4) {
          // hot white center fading to the star's own color at the limb
          const g = ctx.createRadialGradient(X, Y, 0, X, Y, R);
          g.addColorStop(0, b.hot);
          g.addColorStop(0.55, b.core);
          g.addColorStop(1, b.limb);
          ctx.fillStyle = g;
        } else ctx.fillStyle = b.core;
        ctx.beginPath(); ctx.arc(X, Y, R, 0, 6.283); ctx.fill();
      }
    }
    for (const b of bodies) {
      if (b.kind !== 'bh') continue;
      const X = sx(b.x), Y = sy(b.y);
      if (!onScreen(X, Y, visR(b) * 2.5 + 10)) continue;
      drawBlackHole(b, X, Y);
    }
    ctx.globalCompositeOperation = 'source-over';

    drawSelection();
    drawAim();

    if (flash > 0.01) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,236,210,${flash.toFixed(3)})`;
      ctx.fillRect(0, 0, VW, VH);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------
  // Optional timing for benchmarks. When perf.on is false (always, in normal
  // play) the only cost is two boolean checks a frame.
  const perf = { on: false, physics: 0, render: 0 };
  let loopOn = true;
  let lastTime = performance.now();
  function frame(now) {
    if (!loopOn) return;
    requestAnimationFrame(frame);
    const elapsed = Math.max(0, Math.min(50, now - lastTime));
    lastTime = now;
    advance(elapsed);
  }

  // One frame of the game: input timers, simulation, camera and drawing.
  function advance(elapsed) {
    frameN++;

    T.px.set(T.x.subarray(0, T.n));
    T.py.set(T.y.subarray(0, T.n));

    checkLongPress();
    if (hover && frameN % 10 === 0) updateCursor();

    const tPhys = perf.on ? performance.now() : 0;
    if (!paused) {
      // Advance simulated time by rate × real time, in substeps no longer
      // than DT. Slow speeds take one short step per frame, so motion stays
      // smooth; if a crowded scene would take too long, it runs slower instead.
      const want = rate * elapsed / 1000;
      let sub = Math.max(1, Math.ceil(want / DT));
      const dt = want / sub;
      const n = bodies.length;
      const heavy = bodies.reduce((c, b) => c + (isHeavy(b) ? 1 : 0), 0);
      const work = n * (n - 1) / 2 + T.n * heavy + 1;
      sub = Math.min(sub, Math.max(1, Math.floor(1.1e6 / work)));
      for (let s = 0; s < sub; s++) {
        step(dt);
        // trail points and comet dust follow simulated time, so they look the
        // same at every speed and frame rate
        if (simTime - trailClock >= TRAIL_DT) { recordTrails(); trailClock += TRAIL_DT; }
        if (simTime - shedClock >= SHED_DT) { shedComets(); shedClock += SHED_DT; }
      }
      lights = bodies.filter(b => b.kind === 'star');
      if (frameN % 6 === 0) { updateLife(simTime - lifeClock); lifeClock = simTime; }
      if (frameN % 30 === 0) cull();
      for (const b of bodies) {
        b.feed *= 0.97;
        b.spin += reduceMotion ? 0.008 : 0.035;
      }
      for (const f of effects) {
        f.life--;
        if (f.kind === 'wave') f.rad += 12 / cam.z;
      }
      effects = effects.filter(f => f.life > 0);
    }
    // the flash and shake settle even while paused
    flash *= 0.92;
    shake *= 0.9;
    if (selected && selected.dead) deselect();

    // the camera holds still while a throw is being aimed, so the arrow
    // always matches the throw
    if (aim) {
      /* hold */
    } else if (selected && follow) {
      followK = Math.min(1, followK + 0.05);
      const k = 0.08 + 0.92 * followK * followK;
      cam.x += (selected.x - cam.x) * k;
      cam.y += (selected.y - cam.y) * k;
    } else if (cam.target) {
      cam.x += (cam.target.x - cam.x) * 0.12;
      cam.y += (cam.target.y - cam.y) * 0.12;
      if (Math.hypot(cam.target.x - cam.x, cam.target.y - cam.y) < 0.5 / cam.z) cam.target = null;
    }

    const tRender = perf.on ? performance.now() : 0;
    render();
    if (perf.on) { perf.physics = tRender - tPhys; perf.render = performance.now() - tRender; }
    if (frameN % 8 === 0) { updateHud(); updateCard(); }
  }

  let resizeRaf = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(resize);
  });

  // Read-only view of game state for the automated tests in tests/. Only the
  // test runner sets __PU_TEST__, so normal play never exposes it.
  if (window.__PU_TEST__) {
    window.__pu = {
      cam,
      get bodies() { return bodies; }, get aim() { return aim; }, get rate() { return rate; },
      get simTime() { return simTime; }, get dust() { return T.n; },
      get dustState() { return { n: T.n, x: T.x.subarray(0, T.n), y: T.y.subarray(0, T.n), vx: T.vx.subarray(0, T.n), vy: T.vy.subarray(0, T.n) }; },
      get flash() { return flash; }, get shake() { return shake; },
      get selected() { return selected; }, get follow() { return follow; },
      aimMass: () => aim ? aimMass() : 0,
      aimStyle: m => aim ? aimStyle(m) : null,
      // engine constants and maths, so tests and benchmarks never keep their own copies
      radiusFor, circV, seededRand, MSUN, IGNITE, COLLAPSE, AU, YEAR, KMS, EPS2, DT, MAX_T, RATE_DEFAULT, TOOLS, perf,
      sceneRate: key => SCENES[key].rate || RATE_DEFAULT,
      toScreen: o => [sx(o.x), sy(o.y)],
      // counters for the memory soak
      get sprites() { return spriteCache.size; }, get effects() { return effects.length; },
      // repeatable runs: seed the generator, stop the real-time loop and drive
      // whole frames (or bare physics steps) from the test
      seed(n) { rand = seededRand(n); },
      stopLoop() { loopOn = false; },
      tick(frames = 1, elapsedMs = 1000 / 60) { for (let i = 0; i < frames; i++) advance(elapsedMs); },
      physics(steps, dt = DT) { for (let i = 0; i < steps; i++) step(dt); },
      setRate, loadScene, makeBody, addTracer,
      addBody(b) { bodies.push(b); },
      settle() { lights = bodies.filter(o => o.kind === 'star'); accel(); pairs.length = 0; },
      get pairs() { return pairs.length; }
    };
  }

  resize();
  setRate(RATE_DEFAULT);
  loadScene('galaxies');
  updateHud();
  placeHint();
  addEventListener('resize', () => requestAnimationFrame(placeHint));
  // the readout grows as life and heavier bodies appear; keep the hint below it
  if (window.ResizeObserver) new ResizeObserver(placeHint).observe(document.querySelector('.brand'));
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
